name: CD - Deploy to Railway

# Explicit permissions: only read access to contents and metadata
permissions:
  contents: read
  id-token: none
  issues: none
  pull-requests: none
  deployments: none
  statuses: none
  checks: none
  packages: none
  actions: none
  security-events: none
  discussions: none
  repository-projects: none
  pages: none
  attestations: none

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [] # Runs independently; CI is a separate workflow
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment to go live
        run: sleep 60

      - name: Health check with retry
        run: |
          RAILWAY_URL="${{ secrets.RAILWAY_URL }}"
          MAX_ATTEMPTS=10
          ATTEMPT=0

          until [ $ATTEMPT -ge $MAX_ATTEMPTS ]; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${RAILWAY_URL}/api/health" || echo "000")

            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Health check passed (HTTP 200)"
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — got HTTP $RESPONSE, retrying in 15s..."
            sleep 15
          done

          echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
          exit 1

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Summary
        run: |
          echo "🚀 Deployment successful!"
          echo "URL: ${{ secrets.RAILWAY_URL }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    steps:
      - name: Summary
        run: |
          echo "❌ Deployment failed!"
          echo "Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
