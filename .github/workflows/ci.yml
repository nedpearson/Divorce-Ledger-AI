name: CI Hardening

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Environment Sanity Check
        run: npx tsx scripts/checkConfig.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          SESSION_SECRET: ci-test-secret
          APP_MODE: test
          NODE_ENV: test
      - name: Lint
        run: npx eslint .
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run --coverage
        env:
          APP_MODE: test
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          SESSION_SECRET: ci-test-secret
