      summary: Health check
      description: Returns basic application health status
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string

  /health/detailed:
    get:
      tags: [Admin]
      summary: Detailed health check
      description: Returns detailed health status including database and dependencies
      security:
        - adminSecret: []
      responses:
        '200':
          description: Detailed health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: object
                    properties:
                      connected:
                        type: boolean
                      latencyMs:
                        type: integer
                  objectStorage:
                    type: object
                    properties:
                      available:
                        type: boolean
                  stripe:
                    type: object
                    properties:
                      configured:
                        type: boolean

