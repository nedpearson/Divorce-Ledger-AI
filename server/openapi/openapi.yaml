        - sessionAuth: []
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    senderId:
                      type: string
                    senderRole:
                      type: string
                    senderName:
                      type: string
                    content:
                      type: string
                    timestamp:
                      type: string
                      format: date-time
                    isRead:
                      type: boolean

    post:
      tags: [Cases]
      summary: Send a message
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  maxLength: 5000
                attachmentUrl:
                  type: string
                  format: uri
      responses:
        '201':
          description: Message sent

