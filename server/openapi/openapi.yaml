          application/json:
            schema:
              type: object
              required:
                - topic
              properties:
                topic:
                  type: string
                toEventId:
                  type: integer
                  default: 0
      responses:
        '200':
          description: Offset reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  consumerGroup:
                    type: string
                  topic:
                    type: string
                  newOffset:
                    type: integer

  # ETL Pipeline Endpoints
  /etl/status:
    get:
      tags: [ETL]
      summary: Get ETL pipeline status
      description: Returns current ETL pipeline status and recent run information
      security:
        - adminSecret: []
      responses:
        '200':
          description: ETL status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [idle, running, error]
                  lastRun:
                    type: string
                    format: date-time
                  nextScheduledRun:
                    type: string
                    format: date-time

  /etl/history:
    get:
      tags: [ETL]
      summary: Get ETL run history
      security:
        - adminSecret: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: ETL run history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    runId:
                      type: string
                    startedAt:
                      type: string
                      format: date-time
                    completedAt:
                      type: string
                      format: date-time
                    status:
                      type: string
                    recordsProcessed:
                      type: integer

  /etl/run/full:
    post:
      tags: [ETL]
      summary: Trigger full ETL run
      description: Triggers a complete ETL pipeline run
      security:
        - adminSecret: []
      responses:
        '200':
          description: ETL run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  runId:
                    type: string

  /etl/run/incremental:
    post:
      tags: [ETL]
      summary: Trigger incremental ETL run
      description: Triggers an incremental ETL pipeline run (CDC)
      security:
        - adminSecret: []
      responses:
        '200':
          description: ETL run started

  # Filing Export Endpoint
  /filings/export:
    get:
      tags: [Cases]
      summary: Export court filings PDF
      description: |
        Generates court-ready PDF export of case data.
        
        **Business Rules:**
        - Free tier: Watermarked PDFs
        - Individual+ tiers: Clean PDFs without watermarks
        - Includes SHA-256 integrity hash
        - Includes chain of custody records
      security:
        - sessionAuth: []
      parameters:
        - name: caseId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by case ID
        - name: includeViolations
          in: query
          schema:
            type: boolean
            default: true
        - name: includeFinancials
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # Evidence Upload Endpoint
  /evidence:
    post:
      tags: [Evidence]
      summary: Upload evidence file
      description: |
        Uploads an evidence file with metadata.
        
        **Business Rules:**
        - Generates SHA-256 integrity hash
        - Creates initial chain of custody entry
        - Extracts EXIF metadata from images
        - GPS coordinates captured if available
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - violationId
              properties:
                file:
                  type: string
                  format: binary
                violationId:
                  type: string
                  format: uuid
                description:
                  type: string
                deviceId:
                  type: string
      responses:
        '201':
          description: Evidence uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceFile'

  # Pattern Detection Endpoint
  /patterns:
    get:
      tags: [Dashboard]
      summary: Get detected patterns
      description: |
        Returns AI-detected patterns in case data.
        
        **Business Rules:**
        - Requires Pro tier or higher for AI pattern detection
        - Free/Individual tiers get basic pattern matching only
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Detected patterns
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    description:
                      type: string
                    severity:
                      type: string
                      enum: [low, medium, high]
                    relatedItems:
                      type: array
                      items:
                        type: string

