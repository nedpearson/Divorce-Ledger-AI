PROJECT NAME: DivorceASE AI
SUBTITLE: Forensic Financial & Legal Case Management for Divorce
TYPE: Full-stack SaaS (multi-tenant, subscription-based)
ARCHITECTURE: Node.js/Express backend + React frontend + PostgreSQL + AI/ML services
DEPLOYMENT: Replit + Ready for Heroku/AWS scaling

=== PART 1: CORE SYSTEM ARCHITECTURE ===

DATABASE STRUCTURE:
- PostgreSQL (primary database)
- Separate schemas: live_tenants, demo_tenants
  * Never query across schemas
  * Separate encryption keys per tenant
- Redis (session management, caching)
- Firebase Storage (document files, images)
- Elasticsearch (full-text search on documents)

MULTI-TENANT ISOLATION:
Every query includes: WHERE tenant_id = ? AND environment = 'live' (or 'demo')
Never allow cross-tenant data leakage
Row-level security enforced at database level

SUBSCRIPTION MANAGEMENT:
- Stripe integration for payments
- Three tiers: Basic ($49/mo), Professional ($149/mo), Enterprise ($499/mo)
- Automatic downgrade on failed payment
- Feature gating by subscription level

AUTHENTICATION:
- Login page: Email + Password (+ Google OAuth option)
- Session tokens (JWT) stored in HttpOnly cookies
- Demo login: demo@divorcease.ai / demo123 (always resets nightly)
- Live login: attorney@law.com, client@email.com, cpa@forensic.com
- Two-factor authentication (2FA) available for attorneys

=== PART 2: USER ROLES & PERMISSIONS ===

ROLE 1: CLIENT (Divorce Participant)
- Can: Upload documents, track finances, document violations, communicate with attorney
- Cannot: Access other clients' data, modify legal agreements
- Features: Dashboard, finance tracker, violation logger, messaging, document upload

ROLE 2: ATTORNEY (Legal Counsel)
- Can: Access all client data, suggest strategies, build legal cases, message clients
- Cannot: Access clients outside their firm
- Features: All of above + client management, legal templates, case builder, reporting

ROLE 3: FORENSIC CPA (Financial Expert)
- Can: Analyze financials, identify hidden assets, suggest strategies
- Cannot: Modify original documents, access violation logs
- Features: Analytics, forensic analysis, asset discovery, reporting

ROLE 4: SUPPORT/ADMIN (Platform Support)
- Can: Access demo data only, assist users
- Cannot: Access live data
- Features: Demo access, user assistance tools

