=== PART 7: ADVANCED DOCUMENT ANALYZER & OCR ENGINE ===

This is the most critical technical component.

DOCUMENT ANALYZER ARCHITECTURE:
1. Input: Image/PDF from user
2. Pre-processing: 
   - Auto-enhance quality (increase contrast, denoise)
   - Auto-detect document edges (crop to document only)
   - Auto-correct skew (straighten tilted photos)
   - Convert to optimal OCR format (black & white, 300 DPI)
3. OCR Engine: Google Cloud Vision API (or Tesseract for local)
   - Extract all text with high accuracy
   - Detect document type automatically
   - Identify key fields (amounts, dates, vendor names)
4. AI Categorization: TensorFlow/PyTorch model (trained on divorce docs)
   - Classifies into primary category (Financial, Legal, Violation, etc.)
   - Classifies into subcategory (Bank Statement, Daycare Receipt, etc.)
   - Calculates confidence score (0-100%)
   - Flags anomalies (unusual amounts, discrepancies)
5. Data Extraction: 
   - Pulls key info (amounts, dates, names, accounts)
   - Matches against existing records (looks for duplicates)
   - Links related documents (same vendor, same time period)
6. Output: Structured data in database + PDF stored in Firebase

DOCUMENT TYPES & EXTRACTION (Pre-trained Models):

TYPE 1: BANK STATEMENTS
Extract: Account #, holder names, date range, balance, transactions
Flag: Large cash withdrawals, suspicious transfers, missing deposits
Categorize: As: ✅ Financial Record → Bank Statement

TYPE 2: TAX RETURNS
Extract: Filing status, gross income, adjusted income, tax owed, schedules
Flag: Income discrepancies, unreported business income, unusual deductions
Categorize: As: ✅ Financial Record → Tax Documentation

TYPE 3: PAYSTUBS / W-2s
Extract: Gross pay, deductions, year-to-date totals, employer
Flag: Sudden changes in income, bonuses, overtime
Categorize: As: ✅ Income Verification → Salary

TYPE 4: DAYCARE / CHILDCARE INVOICES
Extract: Provider name, child names, dates, amount due, balance
Flag: Amounts over budget, missing receipts, provider changes
Categorize: As: ✅ Child Support → Childcare Expense

TYPE 5: LEGAL DOCUMENTS
Extract: Case number, court, judges, dates, amounts, settlement terms
Flag: Deadlines, non-compliance, modification requests
Categorize: As: ✅ Legal Record → Court Order/Agreement

TYPE 6: TEXT MESSAGES / COMMUNICATIONS
Extract: Sender, recipient, date, time, message content, tone analysis
Flag: Threatening language, evidence of abuse, child-related conflicts
Categorize: As: ✅ Communication → Text Message (Evidence)

TYPE 7: PROPERTY DOCUMENTS
Extract: Address, property type, owner names, value estimate, lien info
Flag: Ownership discrepancies, undisclosed properties, liens
Categorize: As: ✅ Property Settlement → Real Estate

TYPE 8: VEHICLE DOCUMENTS
Extract: Make, model, year, VIN, owner names, value, loan amount
Flag: Hidden vehicles, rapid depreciations, undisclosed purchases
Categorize: As: ✅ Asset Tracking → Vehicle

TYPE 9: INVOICES & RECEIPTS
Extract: Merchant, date, amount, item description, payment method
Flag: Unusual vendors, excessive spending, cash only transactions
Categorize: As: ✅ Expense Tracking → [Specific Category]

TYPE 10: MEDICAL RECORDS / PRESCRIPTIONS
Extract: Patient name, provider name, date, services, costs, insurance info
Flag: Unusual medical expenses, mental health treatment (relevant to custody)
Categorize: As: ✅ Health Expense → Medical

AI CATEGORIZATION MODEL (Proprietary):
- Trained on 10,000+ divorce-related documents
- 99% accuracy after 100k documents processed
- Continuously learns from user corrections
- Uses ensemble method: Multiple models voting on classification
- Confidence scores allow for manual review threshold (e.g., >85% = auto-file, <85% = ask user)

DOCUMENT STATUS TRACKING:
- Uploaded: File received, queued for processing
- Processing: OCR, AI analysis, data extraction in progress
- Ready: Categorized, ready for use (1-3 seconds typically)
- Reviewed: Attorney or CPA has reviewed
- Verified: Confirmed accurate and ready for legal use
- Flagged: Discrepancy or issue detected, needs manual review
- Archived: No longer active (but still searchable)

DATABASE SCHEMA (documents table):
{
  id: UUID,
  tenantId: UUID (FK),
  userId: UUID (FK to uploader),
  fileName: STRING,
  fileUrl: STRING (Firebase URL),
  fileType: STRING (pdf, jpg, png, etc.),
  fileSize: INTEGER (bytes),
  primaryCategory: STRING (Financial, Legal, Violation, etc.),
  subcategory: STRING (Bank Statement, Daycare Invoice, etc.),
  status: ENUM (uploaded, processing, ready, reviewed, verified, flagged, archived),
  aiConfidence: FLOAT (0-100),
  ocrExtractedText: TEXT (full OCR output),
  extractedData: JSONB {
    amount: DECIMAL,
    date: DATE,
    vendorName: STRING,
    accountNumber: STRING,
    ... (varies by type)
  },
  flaggedIssues: ARRAY (strings describing anomalies),
  linkedDocuments: ARRAY (UUIDs of related documents),
  uploadMethod: ENUM (camera, file, email, voice),
  uploadedAt: TIMESTAMP,
  processedAt: TIMESTAMP,
  reviewedBy: UUID (FK to reviewer),
  reviewedAt: TIMESTAMP,
  violationCaseId: UUID (FK, if attached to violation case),
  notes: TEXT (user or attorney notes),
  tags: ARRAY (custom tags: #hidedassets, #inconsistency, etc.),
  createdAt: TIMESTAMP,
  updatedAt: TIMESTAMP
}

