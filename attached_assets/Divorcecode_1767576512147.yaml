LIVE MODE SETUP:
- Email verification required
- Payment method required on signup
- 14-day free trial
- Automatic billing via Stripe
- Access to all user data immediately

DEMO MODE SETUP:
- No payment required
- Auto-generated demo data (realistic scenarios)
- Resets nightly to ensure no persistent changes
- Full feature access (all subscription tiers visible)
- Watermark: "DEMO MODE - Data resets nightly" (top banner)
- Cannot upgrade to paid in demo

DATABASE SCHEMA (auth_users table):
{
  id: UUID (primary key),
  email: STRING (unique),
  passwordHash: STRING (bcrypt, salted),
  fullName: STRING,
  role: ENUM (client, attorney, cpa, admin),
  firm: STRING (attorney only, FK to firms table),
  phone: STRING,
  address: TEXT,
  profilePhoto: STRING (Firebase URL),
  tenantId: UUID (FK to tenants table),
  environment: ENUM (live, demo),
  subscriptionTier: ENUM (basic, professional, enterprise),
  subscriptionStatus: ENUM (active, trialing, past_due, canceled),
  stripeCustomerId: STRING,
  twoFactorEnabled: BOOLEAN,
  createdAt: TIMESTAMP,
  updatedAt: TIMESTAMP,
  lastLogin: TIMESTAMP,
  isActive: BOOLEAN
}

PASSWORD RESET FLOW:
1. User clicks "Forgot Password?"
2. Enter email
3. Email sent with secure token (expires in 1 hour)
4. User clicks link, sets new password
5. Token invalidated after use
6. Sends confirmation email

TWO-FACTOR AUTHENTICATION (Optional, Required for Attorneys):
1. Enable 2FA in settings
2. Scan QR code with authenticator app (Google Authenticator, Authy)
3. Verify 6-digit code
4. Store backup codes
5. On each login, prompt for 6-digit code after password

